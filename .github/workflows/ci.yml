name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads "packageManager" from the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mongodb-memory-server downloads mongod on first use; keep it between runs.
      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongod-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck and test
        run: pnpm verify

      - name: Build
        run: pnpm build
