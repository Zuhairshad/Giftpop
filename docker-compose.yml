# Local development database.
# MongoDB runs as a single-node replica set named rs0 because the API uses
# transactions. The member host is set to localhost:27017 so the API running on
# your machine (outside Docker) can reach it with:
#   mongodb://localhost:27017/giftpop?replicaSet=rs0
# No authentication: for local development only. Never expose this port publicly.
name: giftpop

services:
  mongo:
    image: mongo:8.3.13
    container_name: giftpop-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # Initiates the replica set when the server reports it is not initialised,
      # and passes only once this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            if (db.hello().isWritablePrimary) { quit(0); }
          } catch (e) {}
          try {
            rs.status();
          } catch (e) {
            if (e.codeName === "NotYetInitialized") {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
            }
          }
          quit(1);
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  mongo-config:
